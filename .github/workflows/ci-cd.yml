
name: Game App CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Flask Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stone dependencies
        run: pip install -r stone/requirements.txt

      - name: Install Toss dependencies
        run: pip install -r toss/requirements.txt

      - name: Install testing dependencies
        run: pip install -r requirements-test.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Build Stone Docker image
        run: docker build -t stone:ci ./stone

      - name: Build Toss Docker image
        run: docker build -t toss:ci ./toss

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Stone image
        run: |
          docker tag stone:ci ${{ secrets.DOCKERHUB_USERNAME }}/game-stone:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/game-stone:latest

      - name: Push Toss image
        run: |
          docker tag toss:ci ${{ secrets.DOCKERHUB_USERNAME }}/game-toss:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/game-toss:latest
