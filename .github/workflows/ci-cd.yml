
name: Game App CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Flask Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Stone dependencies
        run: pip install -r stone/requirements.txt

      - name: Install Toss dependencies
        run: pip install -r toss/requirements.txt

      - name: Install testing dependencies
        run: pip install -r requirements-test.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Stone image
        uses: docker/build-push-action@v6
        with:
          context: ./stone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/game-stone:latest

      - name: Build and push Toss image
        uses: docker/build-push-action@v6
        with:
          context: ./toss
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/game-toss:latest
